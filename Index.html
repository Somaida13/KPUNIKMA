<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panduan Kerja Praktek UNIKOM Majenang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-card { border-color: #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <header class="max-w-5xl mx-auto mb-10 text-center">
        <h1 class="text-3xl md:text-5xl font-bold mb-4 text-white">Panduan Kerja Praktek (KP)</h1>
        <p class="text-cyan-400 font-medium text-lg mb-6">Universitas Komputama Majenang</p>
        
        <div class="max-w-4xl mx-auto px-4">
            <img src="Gemini_Generated_Image_9lkq2i9lkq2i9lkq.png" alt="Panduan Kerja Praktek" class="rounded-2xl shadow-2xl border border-slate-700 w-full h-auto">
        </div>
    </header>

    <main class="max-w-5xl mx-auto grid md:grid-cols-3 gap-8">
        <div id="nav" class="md:col-span-1 space-y-4">
            <!-- Navigasi Utama di sini -->
        </div>

        <div class="md:col-span-2 bg-slate-800 rounded-2xl p-8 border border-slate-700 shadow-xl">
            <div id="content">
                <!-- Konten Utama akan muncul di sini -->
            </div>
        </div>
    </main>

    <footer class="max-w-5xl mx-auto mt-12 border-t border-slate-700 pt-8">
        <h3 class="text-xl font-bold mb-6 text-center">Menu Navigasi Tambahan</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <button onclick="window.open('https://drive.google.com/file/d/1SSD8APhGe-zg_1Z43TkeVTrhqdS_AeG-/view?usp=sharing', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">Pedoman KP</button>
            <button onclick="window.open('https://drive.google.com/file/d/1c0DpECVlpz6HxKc0UAovtwo8VzuQzknB/view?usp=sharing', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">SK DPL</button>
            <button onclick="window.open('https://docs.google.com/document/d/1ZmvF6Z-p3ioitm8QuV1tdKOGqB-9nZLq/edit?usp=sharing&ouid=111211727598198662442&rtpof=true&sd=true', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">LEMBAR KONSULTASI KP</button>
            <button onclick="window.open('https://docs.google.com/document/d/1JZrUJpAdDzh0ZU2z5BYpFmJSJS5j56lW/edit?usp=sharing&ouid=111211727598198662442&rtpof=true&sd=true', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">LEMBAR PENILAIAN PEMBIMBING</button>
            <button onclick="window.open('https://docs.google.com/document/d/1tXAdmIL-32Ev-YOn6pUE-emr1Jfw852j/edit?usp=sharing&ouid=111211727598198662442&rtpof=true&sd=true', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">DAFTAR HADIR KP</button>
            <button onclick="window.open('https://docs.google.com/document/d/1Y3pklai_wsg6SwVFs0qaNmlGTf3UXWvn/edit?usp=sharing&ouid=111211727598198662442&rtpof=true&sd=true', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">COVER KERJA PRAKTEK</button>
            <button onclick="window.open('https://docs.google.com/document/d/1naC8Y7usGiviXvMw3SfOGRUgiyLnU4v4/edit?usp=sharing&ouid=111211727598198662442&rtpof=true&sd=true', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">LEMBAR PENGESAHAN KP</button>
            <button onclick="window.open('https://docs.google.com/document/d/1vdfkcGHXYLezKEsGAsfyq88z2WCHsij5/edit?usp=sharing&ouid=111211727598198662442&rtpof=true&sd=true', '_blank')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 transition text-sm">LEMBAR PERNYATAAN KEASLIAN KP</button>
        </div>
    </footer>

    <script>
        const data = [
            { id: '1.1.1', title: 'Pengertian Kerja Praktek', content: 'Kerja Praktek (KP) bagi mahasiswa Informatika dan Sistem Informasi Universitas Komputama adalah mata kuliah wajib 3 SKS. Ini merupakan proses latihan bekerja (bukan ujian), di mana mahasiswa merasakan pengalaman profesional di bawah bimbingan untuk menyiapkan diri menghadapi dunia kerja nyata.', color: 'bg-blue-500' },
            { id: '1.1.2', title: 'Tujuan Kerja Praktek', content: 'Tujuan utama meliputi: pengembangan IPTEK di luar kampus, pemantapan keterampilan lapangan untuk laporan akhir, internalisasi nilai, norma, dan etika profesional, serta kemampuan beradaptasi dengan perkembangan teknologi terkini.', color: 'bg-green-500' },
            { id: '1.1.3', title: 'Bentuk Kerja Praktek', content: 'KP dilakukan dalam format magang (individu/kelompok) berupa: Analisis & perancangan sistem, pengembangan perangkat lunak atau jaringan komputer, eksplorasi/penerapan perangkat lunak, serta kegiatan lain yang relevan.', color: 'bg-purple-500' },
            { id: '1.1.4', title: 'Batasan Kerja Praktek', content: 'Dilaksanakan pada institusi/perusahaan dengan proyek khusus sesuai bidang keilmuan. Mahasiswa bebas memilih bentuk KP dengan memperhatikan ketentuan ruang lingkup sistem yang ditetapkan oleh Dosen Pembimbing dan Kaprodi. serta isu teknologi yang berkembang pada saat pengerjaan serta pelaksanaan selama kegiatan kerja praktek berlangsung', color: 'bg-orange-500' }
        ];

        function renderNav() {
            const nav = document.getElementById('nav');
            data.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl transition-all duration-300 flex items-center gap-4 border ${index === 0 ? 'bg-slate-800 active-card' : 'bg-slate-800/50 border-slate-700'}`;
                btn.innerHTML = `<div class="p-2 rounded-lg ${item.color} w-8 h-8"></div><span class="font-semibold">${item.id} ${item.title}</span>`;
                // Navigasi tidak membuka tab baru, tapi mengupdate konten
                btn.onclick = () => updateContent(index);
                nav.appendChild(btn);
            });
        }

        function updateContent(index) {
            const item = data[index];
            document.getElementById('content').innerHTML = `
                <div class="flex items-center gap-4 mb-6">
                    <div class="p-4 rounded-2xl ${item.color} w-12 h-12"></div>
                    <h2 class="text-2xl font-bold">${item.title}</h2>
                </div>
                <p class="text-lg text-slate-300 leading-relaxed">${item.content}</p>
            `;
            // Update visual tombol aktif
            document.querySelectorAll('#nav button').forEach((btn, i) => {
                btn.className = i === index ? 'w-full text-left p-4 rounded-xl transition-all duration-300 flex items-center gap-4 border bg-slate-800 active-card' : 'w-full text-left p-4 rounded-xl transition-all duration-300 flex items-center gap-4 border bg-slate-800/50 border-slate-700';
            });
        }

        renderNav();
        updateContent(0);
    </script>
</body>
</html>
